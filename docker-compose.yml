---
version: '1'
services:
    dev:
        build:
            context: .
        volumes:
            - './war:/opt/'

    prod:
        image: tomcat:9.0
        ports:
            - '8888:8080'
        volumes:
            - './war/hello-1.0.war:/usr/local/tomcat/webapps/'
        depends_on:
            - dev