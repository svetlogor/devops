---
version: '1'
services:
    dev:
        build:
            context: .
        volumes:
            - 'war:/opt/apache-tomcat-9.0.34/webapps'

    prod:
        image: tomcat:9.0
        ports:
            - '8888:8080'
        volumes:
            - 'war:/usr/local/tomcat/webapps'
        depends_on:
            - dev
volumes:
    war: