---
version: '1'
services:
    dev:
        build:
            context: .
        volumes:
            - './war:/boxfuse-sample-java-war-hello/target'

    prod:
        image: tomcat:9.0
        ports:
            - '8888:8080'
        volumes:
            - './war:/usr/local/tomcat/webapps'
        depends_on:
            - dev